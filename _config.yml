title: Red Teaming Guide
description: A comprehensive, community-driven red teaming and penetration testing guide. From beginner to advanced.
baseurl: /Red-teaming
url: https://prasannakumar018.github.io
markdown: kramdown
kramdown:
  input: GFM
  hard_wrap: false

plugins:
  - jekyll-seo-tag
  - jekyll-sitemap

# Include all content directories
include:
  - "Attacks based on Language"
  - "Common Attacks Listings"
  - "CyberSecurity"
  - "Learnings from CTF's"
  - "writeups"
  - "docs"

# Exclude non-content files
exclude:
  - .obsidian
  - .DS_Store
  - .claude
  - "*.base"
  - "*.canvas"
  - _templates
  - Gemfile
  - Gemfile.lock
  - LICENSE-CODE
  - node_modules
  - vendor
